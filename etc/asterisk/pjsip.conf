; ==========================================
; 4. CUENTA DE LA CENTRAL 1 (El Asesor)
; ==========================================

; --- USUARIO 200 ---
; Este es el Zoiper de la Central 1. La gente lo llama marcando *111.
[200](plantilla_endpoint)
context=central-1  ; <- IMPORTANTE: Tiene privilegios distintos (puede llamar al *010)
auth=200-auth
aors=200

[200-auth](plantilla_auth)
password=ClaveCentral200
username=200

[200](plantilla_aor)

