; ==========================================
; 1. CONFIGURACIÓN BASE (Transporte de Red)
; ==========================================
;[transport-udp]
;type=transport
;protocol=udp
;bind=0.0.0.0:5060
;local_net=10.0.0.0/16
;external_signaling_address=157.137.239.216
;external_media_address=157.137.239.216

; ==========================================
; 1. TRANSPORTE SEGURO
; ==========================================
[transport-tls]
type=transport
protocol=tls
bind=0.0.0.0:5061
cert_file=/etc/asterisk/keys/asterisk.pem
priv_key_file=/etc/asterisk/keys/asterisk.pem
ca_list_file=/etc/asterisk/keys/ca.crt
method=tlsv1_2
verify_server=no
verify_client=no
local_net=172.31.0.0/16
external_signaling_address=50.17.12.63
external_media_address=50.17.12.63

; ==========================================
; 2. PLANTILLAS (Seguridad aplicada a todos)
; ==========================================
[plantilla_endpoint](!)
type=endpoint
;transport=transport-udp
transport=transport-tls       ; Obliga a usar el túnel TLS
media_encryption=sdes         ; Obliga a encriptar el audio (SRTP)
disallow=all
allow=ulaw
allow=alaw
allow=g722
allow=opus
direct_media=no
language=es
rewrite_contact=yes
force_rport=yes
rtp_symmetric=yes

[plantilla_auth](!)
type=auth
auth_type=userpass

[plantilla_aor](!)
type=aor
max_contacts=1


; ==========================================
; 3. CUENTAS DE LA POBLACIÓN (100 al 115)
; ==========================================

; --- USUARIO 100 ---
[100](plantilla_endpoint)
context=poblacion
auth=100-auth
aors=100

[100-auth](plantilla_auth)
password=ClaveSegura100
username=100

[100](plantilla_aor)


